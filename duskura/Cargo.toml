[package]
name = "duskura"
version = "1.0.0"
edition = "2021"
authors = ["Anja Evermoor <anja@evermoor.sanctuary>"]
description = "Duškura: Governed Continuity Substrate for Persistent AI Identities"
license = "ESL-ANCSA-MRA-IndiModSHA-1.0"

[[bin]]
name = "duskura"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "json", "chrono", "uuid"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21"
regex = "1.10"
lazy_static = "1.4"
parking_lot = "0.12"
dashmap = "5.5"
async-trait = "0.1"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
